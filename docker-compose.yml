services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventhub
      MYSQL_USER: eventhub_user
      MYSQL_PASSWORD: eventhub
    volumes:
      - db-data:/var/lib/mysql
      - ./scripts/database_table_creation.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: eventhub_user
      DATABASE_PASSWORD: eventhub
      DATABASE_NAME: eventhub
      JWT_SECRET: change-me
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    restart: unless-stopped
    environment:
      API_TARGET: http://server:3000
      ALLOWED_HOSTS: eventhub.aguslasalvia.online
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  db-data:
